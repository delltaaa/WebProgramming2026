<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Anggota | SIMPUS-Mini</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-restrict="admin">

    <header class="app-nav">
        <div class="logo">
            <span class="mark"></span>
            <h2>SIMPUS-Mini</h2>
        </div>
        <button class="nav-toggle" id="nav-toggle" aria-label="Buka menu navigasi" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <nav id="main-nav">
            <ul>
                <li><a href="../index.html">Dashboard</a></li>
                <li><a href="../buku/buku-list.html">Kelola Buku</a></li>
                <li class="admin-only"><a href="anggota-list.html" class="active">Kelola Anggota</a></li>
                <li><a href="#">Peminjaman</a></li>
            </ul>
        </nav>
        <div class="user-box">
            <span id="user-display"></span>
            <button type="button" class="logout-btn" data-logout><i class="fa-solid fa-arrow-right-from-bracket"></i> Keluar</button>
        </div>
    </header>

    <main class="container">
        <a href="anggota-list.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Kembali ke Daftar Anggota
        </a>

        <div class="form-card">
            <h2 class="form-card-title">Tambah Anggota Baru</h2>
            <p class="form-card-desc">Pendaftaran anggota baru perpustakaan.</p>

            <form action="anggota-list.html" method="GET">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="id_anggota">ID Anggota</label>
                        <input type="text" id="id_anggota" placeholder="Contoh: AG-103" required>
                    </div>

                    <div class="form-group">
                        <label for="telepon">Nomor Telepon / WA</label>
                        <input type="tel" id="telepon" placeholder="08xxxxxxxxxx" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="nama">Nama Lengkap</label>
                        <input type="text" id="nama" placeholder="Masukkan nama lengkap anggota" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="email">Alamat Email</label>
                        <input type="email" id="email" placeholder="contoh@domain.com" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="alamat">Alamat Tinggal</label>
                        <textarea id="alamat" rows="2" placeholder="Alamat lengkap..."></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="anggota-list.html" class="btn-cancel">Batal</a>
                    <button type="submit" class="btn-submit"><i class="fa-solid fa-user-check"></i> Simpan Anggota</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="app-footer">
        <div class="footer-inner">
            <p>&copy; 2026 SIMPUS-Mini &bull; Created by <strong>Adelia Amanta Putri</strong></p>
            <ul class="footer-links">
                <li><a href="#">Bantuan</a></li>
                <li><a href="#">Kebijakan Privasi</a></li>
                <li><a href="#">Hubungi Kami</a></li>
            </ul>
        </div>
    </footer>

    <script src="../assets/js/script.js"></script>
</body>
</html>
