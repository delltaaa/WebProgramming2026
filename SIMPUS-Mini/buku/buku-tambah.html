<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Buku | SIMPUS-Mini</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-restrict="admin">

    <header class="app-nav">
        <div class="logo">
            <div class="login-icon-mark">
                <i class="fa-solid fa-book-bookmark"></i>
            </div>
            <h2>SIMPUS-Mini</h2>
        </div>
        <button class="nav-toggle" id="nav-toggle" aria-label="Buka menu navigasi" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <nav id="main-nav">
            <ul>
                <li><a href="../index.html">Dashboard</a></li>
                <li><a href="buku-list.html" class="active">Kelola Buku</a></li>
                <li class="admin-only"><a href="../anggota/anggota-list.html">Kelola Anggota</a></li>
                <li><a href="#">Peminjaman</a></li>
            </ul>
        </nav>
        <div class="user-box">
            <span id="user-display"></span>
            <button type="button" class="logout-btn" data-logout><i class="fa-solid fa-arrow-right-from-bracket"></i> Keluar</button>
        </div>
    </header>

    <main class="container">
        <a href="buku-list.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Kembali ke Daftar Buku
        </a>

        <div class="form-card">
            <h2 class="form-card-title">Tambah Buku Baru</h2>
            <p class="form-card-desc">Isi detail informasi buku di bawah ini.</p>

            <form action="buku-list.html" method="GET">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="kode_buku">Kode Buku</label>
                        <input type="text" id="kode_buku" placeholder="Contoh: BK-003" required>
                    </div>

                    <div class="form-group">
                        <label for="isbn">Nomor ISBN</label>
                        <input type="text" id="isbn" placeholder="978-xxx-xxxx-xx-x">
                    </div>

                    <div class="form-group full-width">
                        <label for="judul">Judul Buku</label>
                        <input type="text" id="judul" placeholder="Masukkan judul buku lengkap" required>
                    </div>

                    <div class="form-group">
                        <label for="pengarang">Pengarang / Penulis</label>
                        <input type="text" id="pengarang" placeholder="Nama penulis" required>
                    </div>

                    <div class="form-group">
                        <label for="kategori">Kategori</label>
                        <select id="kategori" required>
                            <option value="">-- Pilih Kategori --</option>
                            <option value="Teknologi">Teknologi & Komputer</option>
                            <option value="Pemrograman">Pemrograman</option>
                            <option value="Sains">Sains & Matematika</option>
                            <option value="Fiksi">Fiksi & Sastra</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="jumlah">Jumlah Stok Buku</label>
                        <input type="number" id="jumlah" min="1" placeholder="1" required>
                    </div>

                    <div class="form-group">
                        <label for="tahun">Tahun Terbit</label>
                        <input type="number" id="tahun" placeholder="2026">
                    </div>

                    <div class="form-group full-width">
                        <label for="deskripsi">Deskripsi Singkat / Ringkasan</label>
                        <textarea id="deskripsi" rows="3" placeholder="Catatan atau sinopsis buku..."></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="buku-list.html" class="btn-cancel">Batal</a>
                    <button type="submit" class="btn-submit"><i class="fa-solid fa-floppy-disk"></i> Simpan Buku</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="app-footer">
        <div class="footer-inner">
            <p>&copy; 2026 SIMPUS-Mini &bull; Created by <strong>Adelia Amanta Putri</strong></p>
            <ul class="footer-links">
                <li><a href="#">Bantuan</a></li>
                <li><a href="#">Kebijakan Privasi</a></li>
                <li><a href="#">Hubungi Kami</a></li>
            </ul>
        </div>
    </footer>

    <script src="../assets/js/script.js"></script>
</body>
</html>
